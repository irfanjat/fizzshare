# ── peershare — single-node production stack (Phase 5) ────────────────────────
#  coturn      STUN/TURN. Host networking on purpose (docs/08): relay
#              allocations must see the real NICs, and mapping 41 UDP relay
#              ports through bridge NAT is both fragile and unverifiable.
#  signaling   P2P control plane + app + health/metrics (never sees file bytes).
#  caddy       TLS termination + reverse proxy → the browser's only origin.
#
# Bring up the whole app with:
#   cp infra/.env.example infra/.env   # then edit PUBLIC_HOST + secret
#   docker compose -f infra/docker-compose.yml up --build
# (podman: same command / `podman compose`).

name: peershare

services:
  coturn:
    build:
      context: ..
      dockerfile: infra/docker/coturn.Dockerfile
    image: peershare-coturn:local
    restart: unless-stopped
    # The shared secret injected here must equal the signaling server's
    # TURN_SHARED_SECRET — it signs the credentials minted in /room.
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}"
      - "--realm=${TURN_REALM:?TURN_REALM is required}"
    network_mode: host
    # external-ip is set in Phase 6 (EC2 + EIP); leave unset locally.
    volumes:
      - ../turn/turnserver.conf:/etc/coturn/turnserver.conf:ro,Z

  signaling:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.server
    image: peershare-server:local
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_URL: "https://${PUBLIC_HOST:?PUBLIC_HOST is required}"
      ORIGINS: "${ORIGINS:?ORIGINS is required (Origin check allows list)}"
      TURN_HOSTNAME: "${PUBLIC_HOST}"
      TURN_SHARED_SECRET: "${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}"
      TURN_STUN_PORT: "3478"
      TURN_UDP_PORT: "3478"
      TURN_TLS_PORT: "5349"
      TURN_LIFETIME_SEC: "${TURN_LIFETIME_SEC:-3600}"
      ROOM_TTL_SEC: "${ROOM_TTL_SEC:-3600}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?SITE_ADDRESS is required (prod: your-domain, local: localhost:80)}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../infra/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling

volumes:
  caddy_data:
  caddy_config: