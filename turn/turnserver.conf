# ── peershare — coturn STUN/TURN (Phase 5) ────────────────────────────────────
# One service, two jobs (docs/01): answers STUN bindings (NAT discovery) and,
# only when peers cannot reach each other directly, relays DTLS bytes.
#
# Auth model: TURN REST API (draft-uberti), the same scheme server/src/turn.ts
# uses to mint credentials. The shared secret is NOT in this file — Compose
# injects it at runtime via --static-auth-secret so the secret never lands in
# the repo or the image.
#
# IMPORTANT for the live demo: relay ports (49160-49200/udp) must be open in
# the OS firewall AND the cloud Security Group (docs/04 pitfall #2).

# ── Listening ────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# relay-ip / external-ip are deliberately NOT pinned here:
#   - Local/single-NIC hosts: coturn auto-detects the machine's IP and
#     advertises it in relay candidates (correct out of the box).
#   - Cloud SNAT (EC2 + EIP in Phase 6): inject external-ip=<EIP> via the
#     deploy user-data so relay candidates advertise the public address.

# ── Relay allocations ─────────────────────────────────────────────────────────
# 41 UDP ports; open this whole range (49160-49200/udp) on the firewall.
min-port=49160
max-port=49200

# Refuse to relay into private ranges — stops the relay being abused as a
# proxy into a private LAN. LAN peers should use host/srflx candidates anyway.
# (coturn takes plain IPs or lo-hi ranges, NOT CIDR.)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1-::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:0.255.255.255

# ── Auth (TURN REST API) ──────────────────────────────────────────────────────
realm=peershare.local
use-auth-secret
stale-nonce=600

# ── TLS for turns: (5349) ─────────────────────────────────────────────────────
# Self-signed cert generated at image build so the TLS listener works out of
# the box; browsers will warn on this turn: URL only (UDP relay is unaffected).
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/priv.pem

# ── Misc hardening / ops ───────────────────────────────────────────────────────
no-tlsv1
no-tlsv1_1
fingerprint
log-file=stdout
simple-log
verbose